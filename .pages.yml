media:
  input: images
  output: /images

content:
  - name: products
    label: Cakes and desserts
    type: file
    path: data/products.json
    format: json
    list: true
    fields:
      - name: name
        label: Product name
        type: string
      - name: description
        label: Description
        type: text
      - name: price
        label: Price
        type: string
      - name: image
        label: Photo
        type: image

  - name: gallery
    label: Photo gallery
    type: file
    path: data/gallery.json
    format: json
    list: true
    fields:
      - name: image
        label: Photo
        type: image
      - name: caption
        label: Caption
        type: string
